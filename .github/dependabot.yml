version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Etc/UTC

updates:
  - package-ecosystem: npm
    directory: /docs
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: npm
    directory: /web
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    ignore:
      # eslint 10 dropped context.getFilename(), which eslint-plugin-react
      # (pulled in by eslint-config-next) still calls — it crashes the lint
      # step. Stay on eslint 9 until the plugin supports eslint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /api
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: weekly-dependencies
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ['*']
