name: checks

# Lightweight CI gate. Runs on PRs and pushes to main, and is also
# callable (workflow_call) so the internal deploy pipeline can require it
# before shipping. Blocking checks cover web typecheck + tests (vitest) +
# eslint, and api fmt + clippy + tests (cargo test).

on:
  pull_request:
  # main pushes run checks via the deploy-internal pipeline (workflow_call
  # below), so no standalone push trigger here — avoids a duplicate run.
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      # Pin explicitly: action-setup looks for `packageManager` in the
      # repo-root package.json, but ours lives in web/. Keep in sync with
      # web/package.json's packageManager field.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.24.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install deps
        run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - name: Typecheck (blocking)
        run: npx tsc --noEmit
      - name: Test (blocking)
        run: pnpm test
      - name: Lint (blocking)
        run: npx eslint .

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: api
      # Two PRs each adding "the next" migration number merge cleanly but
      # produce a duplicate sqlx version, which crashes the api at boot and
      # poisons any database it touches (v2026.8.1 shipped that way).
      - name: Migration version numbers are unique (blocking)
        run: |
          dups=$(ls migrations/*.sql | sed 's|.*/||; s|_.*||' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "Duplicate migration version(s): $dups"
            ls migrations/ | grep -E "^($(echo "$dups" | paste -sd'|' -))_"
            exit 1
          fi
      - name: Format (blocking)
        run: cargo fmt --check
      # No `-D warnings`: there's a pre-existing clippy lint
      # (enum_variant_names) we haven't addressed. This still fails the
      # build on compile errors and clippy *errors*.
      - name: Clippy (blocking)
        run: cargo clippy --all-targets
      - name: Test (blocking)
        run: cargo test
      - name: Pydantic runner tests (blocking)
        run: |
          python3 -m venv /tmp/pydantic-ai
          /tmp/pydantic-ai/bin/pip install --no-cache-dir \
            pydantic-ai pyyaml==6.0.2 composio==0.13.1 \
            pydantic-ai-skills==0.11.0 pytest==9.1.1
          /tmp/pydantic-ai/bin/pytest tests/test_run_pydantic_*.py
