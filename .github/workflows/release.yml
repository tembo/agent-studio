# Build and publish the TAS container images to GitHub Container
# Registry (GHCR) on every CalVer release tag.
#
# Trigger: pushing a tag like `v2026.5.29` (the same tag that cuts a
# GitHub Release). Produces, for each of the two services:
#
#   ghcr.io/<owner>/tas-api:2026.5.29   ghcr.io/<owner>/tas-web:2026.5.29
#   ghcr.io/<owner>/tas-api:2026.5      ghcr.io/<owner>/tas-web:2026.5
#   ghcr.io/<owner>/tas-api:latest      ghcr.io/<owner>/tas-web:latest
#
# Each image is signed (cosign keyless) and scanned (Trivy, report-only),
# carries SBOM + provenance attestations, and the published version is
# proposed as a PR bumping the compose.release.yaml default. Customers
# consume the images via compose.release.yaml. Postgres is the upstream
# official image and is never republished here.
#
# Scope: linux/amd64. Multi-arch (arm64 via a native runner) is a
# deliberate later step — see the image-publishing strategy.

name: Release images

on:
  push:
    tags:
      - "v*"
  # Manual re-publish of an existing tag if a run needs replaying.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re)build, e.g. v2026.5.29"
        required: true

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless signing + provenance
      security-events: write # upload Trivy SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tas-api
            context: ./api
          - image: tas-web
            context: ./web
    steps:
      - name: Check out the tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # `v2026.5.29` → 2026.5.29 + 2026.5 + latest. metadata-action
          # only moves `latest` for the highest semver tag (latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      - name: Build and push ${{ matrix.image }}
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          # Omitting `platforms` builds for the runner arch (amd64).
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the release version into the image (consumed by the web
          # Dockerfile's TAS_VERSION ARG; api ignores it). metadata-action
          # derives `version` as the bare CalVer, e.g. 2026.6.2.
          build-args: |
            TAS_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: true
          sbom: true

      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        # Signs by immutable digest, so every tag pointing at it is covered.
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Scan image (Trivy, report to log)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0" # report-only — never blocks the release
          ignore-unfixed: true

      - name: Scan image (Trivy, SARIF for Security tab)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        # continue-on-error: code scanning upload needs GitHub Advanced
        # Security on private repos; if it's unavailable the table report
        # above is still in the job log, so don't fail the release.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: ${{ matrix.image }}

  # Keep compose.release.yaml's default tag in lockstep with the release
  # just published, so the out-of-box pin never goes stale. Opens a PR
  # rather than pushing to main, so it works under branch protection and
  # the bump stays reviewable.
  bump-compose:
    needs: images
    # Only on a real tag push (not a manual re-publish, which could point
    # at an older tag and move the default backwards), and only for
    # stable releases — a prerelease tag (e.g. v2026.5.31-beta, which
    # carries a `-`) publishes images but must not become the default
    # customer pin.
    if: github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the bump branch + commit
      pull-requests: write # open the PR
    steps:
      # The whole job runs through the GitHub API (no checkout, no local git).
      # Commits made via the Contents API are signed with GitHub's web-flow
      # GPG key, so the bump satisfies main's `required_signatures` ruleset and
      # the PR squash-merges cleanly — a bot doing `git commit` + `git push`
      # would push an UNSIGNED commit and the merge would need an admin override.
      - name: Open a signed PR bumping the TAS_VERSION default
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_NAME#v}"
          BRANCH="release/bump-compose-${VERSION}"
          TITLE="release: bump compose.release.yaml default to ${VERSION}"

          # Current main head + the file's blob sha and decoded content.
          BASE_SHA="$(gh api "repos/${REPO}/git/ref/heads/main" --jq '.object.sha')"
          FILE_JSON="$(gh api "repos/${REPO}/contents/compose.release.yaml?ref=main")"
          FILE_SHA="$(jq -r '.sha' <<<"$FILE_JSON")"
          CONTENT="$(jq -r '.content' <<<"$FILE_JSON" | base64 -d)"

          # Bump every `TAS_VERSION:-<old>` default to the new version.
          NEW_CONTENT="$(sed -E "s/(TAS_VERSION:-)[^}]+/\1${VERSION}/g" <<<"$CONTENT")"
          if [ "$NEW_CONTENT" = "$CONTENT" ]; then
            echo "compose.release.yaml already at ${VERSION}; nothing to do."
            exit 0
          fi

          # Point the bump branch at main's head (create, or reset if re-running
          # the same tag) so the commit below applies onto current main.
          if gh api "repos/${REPO}/git/ref/heads/${BRANCH}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${REPO}/git/refs/heads/${BRANCH}" \
              -f sha="${BASE_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${REPO}/git/refs" \
              -f ref="refs/heads/${BRANCH}" -f sha="${BASE_SHA}" >/dev/null
          fi

          # Commit the bump via the Contents API (signed by web-flow).
          gh api -X PUT "repos/${REPO}/contents/compose.release.yaml" \
            -f message="${TITLE}" \
            -f branch="${BRANCH}" \
            -f sha="${FILE_SHA}" \
            -f content="$(printf '%s\n' "$NEW_CONTENT" | base64 -w0)" >/dev/null

          # Create the PR, or no-op if one is already open for this branch.
          gh pr create --repo "${REPO}" --base main --head "${BRANCH}" --title "${TITLE}" \
            --body "Automated: keep \`compose.release.yaml\`'s default pin in lockstep with the \`${REF_NAME}\` release, so customers deploying from published images get the matching version out of the box. The api applies DB migrations on boot." \
            || echo "PR already exists for ${BRANCH}; branch updated."
