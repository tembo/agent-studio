name: Backlog taxonomy

on:
  issues:
    types: [opened, reopened, labeled, unlabeled, closed]
  pull_request:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: backlog-taxonomy
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  sync-backlog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync taxonomy labels
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const action = context.payload.action;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = issue.number;
            const names = new Set(issue.labels.map((label) => label.name));

            async function add(name) {
              if (names.has(name)) return;
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number,
                labels: [name],
              });
              names.add(name);
            }

            async function remove(name) {
              if (!names.has(name)) return;
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name,
              });
              names.delete(name);
            }

            const priorities = [...names].filter((name) =>
              name.startsWith("priority: "),
            );
            const statuses = [...names].filter((name) =>
              name.startsWith("status: "),
            );

            if (action === "closed") {
              for (const status of statuses) await remove(status);
              return;
            }

            if ((action === "opened" || action === "reopened") && statuses.length === 0) {
              await add("status: backlog");
            }

            const userRequestAdded =
              action === "labeled" && context.payload.label?.name === "user request";
            if (userRequestAdded && !names.has("priority: p0")) {
              for (const priority of priorities) await remove(priority);
              await add("priority: p1");
            } else if ((action === "opened" || action === "reopened") && priorities.length === 0) {
              await add(names.has("user request") ? "priority: p1" : "priority: p2");
            }

      - name: Sync Agent Studio Backlog project
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: node .agents/skills/reprioritize-backlog/scripts/sync-project.mjs
