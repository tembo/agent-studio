# Tembo Agent Studio — release deployment using prebuilt images.
#
# Runs TAS from images published to GHCR by .github/workflows/release.yml,
# so the host never compiles Rust/Node from source.
#
# Usage:
#   cp .env.example .env            # fill in secrets
#   docker compose -f compose.release.yaml pull
#   docker compose -f compose.release.yaml up -d
#
# Version: defaults to the pin below. Override per deploy by setting
# TAS_VERSION in .env (e.g. TAS_VERSION=2026.5.29). The api applies
# database migrations on boot, so upgrading is just:
#   (bump TAS_VERSION) docker compose -f compose.release.yaml pull && \
#     docker compose -f compose.release.yaml up -d
#
# The image owner defaults to `tembo`; override with TAS_IMAGE_OWNER if
# you publish to your own GHCR namespace (e.g. a fork).

services:
  postgres:
    # Bumping this major (e.g. 18 -> 19 later) is NOT a tag swap for an
    # existing deployment: Postgres data dirs aren't compatible across
    # majors, so an upgrade needs pg_upgrade or dump/restore. Or point
    # DATABASE_URL at managed Postgres and drop this service.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tas}
      POSTGRES_DB: ${POSTGRES_DB:-tas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # postgres:18+ stores data in a version subdir under
      # /var/lib/postgresql (not /var/lib/postgresql/data) — mount the
      # host directory so the image manages the layout.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tas} -d ${POSTGRES_DB:-tas}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ghcr.io/${TAS_IMAGE_OWNER:-tembo}/tas-api:${TAS_VERSION:-2026.8.2}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tas}:${POSTGRES_PASSWORD:-tas}@postgres:5432/${POSTGRES_DB:-tas}
      TAS_ENCRYPTION_KEY: ${TAS_ENCRYPTION_KEY:?TAS_ENCRYPTION_KEY must be set in .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set in .env}
      API_MAX_CONCURRENT_RUNS: ${API_MAX_CONCURRENT_RUNS:-10}
      # Empty delegates to the api's max-aware default (half of total slots).
      API_RESERVED_SUB_AGENT_RUNS: ${API_RESERVED_SUB_AGENT_RUNS:-}
      # Empty delegates to the api default (3 concurrent children per orchestrator).
      API_MAX_CONCURRENT_SUB_AGENTS_PER_ORCHESTRATOR: ${API_MAX_CONCURRENT_SUB_AGENTS_PER_ORCHESTRATOR:-}
      RUST_LOG: ${RUST_LOG:-info,tas_api=debug}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  web:
    image: ghcr.io/${TAS_IMAGE_OWNER:-tembo}/tas-web:${TAS_VERSION:-2026.8.2}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tas}:${POSTGRES_PASSWORD:-tas}@postgres:5432/${POSTGRES_DB:-tas}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set in .env}
      TAS_ENCRYPTION_KEY: ${TAS_ENCRYPTION_KEY:?TAS_ENCRYPTION_KEY must be set in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      API_INTERNAL_URL: http://api:8080
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN must be set in .env}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      # Note: the login-footer version is baked into the image at build
      # time (web Dockerfile TAS_VERSION ARG), so it always matches the
      # running image — no env var to set or keep in sync here. The
      # ${TAS_VERSION} below only selects which image tag to pull.
      TAS_INSTANCE_NAME: ${TAS_INSTANCE_NAME:-Tembo Agent Studio}
      INSTANCE_ADMIN_EMAILS: ${INSTANCE_ADMIN_EMAILS:-}
      TAS_SIGNUP_POLICY: ${TAS_SIGNUP_POLICY:-}
      TAS_SIGNUP_ALLOWED_DOMAINS: ${TAS_SIGNUP_ALLOWED_DOMAINS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-}
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      GOOGLE_CONNECTIONS_CLIENT_ID: ${GOOGLE_CONNECTIONS_CLIENT_ID:-}
      GOOGLE_CONNECTIONS_CLIENT_SECRET: ${GOOGLE_CONNECTIONS_CLIENT_SECRET:-}
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  postgres_data:
